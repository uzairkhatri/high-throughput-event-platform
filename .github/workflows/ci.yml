name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,distributed]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test client dependencies
        run: python -m pip install -e ".[dev,distributed]"
      - name: Start distributed stack
        run: docker compose up -d --build api worker
      - name: Run end-to-end tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest -q -m integration
      - name: Capture benchmark environment
        run: |
          mkdir -p benchmark-results
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            lscpu
            free -h
            docker version
            docker compose version
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}'
          } | tee benchmark-results/environment.txt
      - name: Run reproducible k6 smoke profile
        run: docker compose --profile benchmark run --rm k6
      - name: Upload raw benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: benchmark-results/
          if-no-files-found: error
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop distributed stack
        if: always()
        run: docker compose down -v
